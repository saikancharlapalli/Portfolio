<!DOCTYPE html>
<html>
<head>
    <title>Multi Level Table</title>
</head>
<body>

<center>

<table border="2" cellpadding="8" cellspacing="3">

    <tr>
        <th colspan="5">
            <font size="5">My Multi Level Table</font>
        </th>
    </tr>

    <tr>
        <th rowspan="2" colspan="2">Column 0</th>
        <th rowspan="2">Column 1</th>
        <th colspan="2">Column 2</th>
    </tr>

    <tr>
        <th>Column 2a</th>
        <th>Column 2b</th>
    </tr>

    <tr>
        <td rowspan="2">Row 1</td>
        <td>Row 1a</td>
        <td>123</td>
        <td>456</td>
        <td>789</td>
    </tr>

    <tr>
        <td>Row 1b</td>
        <td>123</td>
        <td>456</td>
        <td>789</td>
    </tr>

    <tr>
        <td colspan="2">Row 2</td>
        <td>123</td>
        <td>456</td>
        <td>789</td>
    </tr>

</table>

</center>

</body>
</html>
