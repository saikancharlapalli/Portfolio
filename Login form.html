<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>
<body>

<form>

    <fieldset>
        <legend><b>Login</b></legend>

        <h3>Username*</h3>
        <input type="text" name="username" size="30" required>

        <h3>Password*</h3>
        <input type="password" name="password" size="30" required>

    </fieldset>

    <br>

    <fieldset>
        <legend><b>Gender*</b></legend>

        <input type="radio" name="gender" value="Male">
        Male

        <input type="radio" name="gender" value="Female">
        Female

    </fieldset>

    <br>

    <fieldset>
        <legend><b>Programming Skill</b></legend>

        <input type="checkbox" name="skill" value="Java">
        Java

        <input type="checkbox" name="skill" value="C++" checked>
        C++

        <input type="checkbox" name="skill" value="C#">
        C#

    </fieldset>

    <br>

    <fieldset>
        <legend><b>Fruit</b></legend>

        Choose a fruit:

        <select name="fruit">
            <option>Apple</option>
            <option selected>Banana</option>
            <option>Mango</option>
            <option>Orange</option>
            <option>Grapes</option>
        </select>

    </fieldset>

    <br>

    <textarea name="comment" rows="10" cols="70"
    placeholder="Enter your comment here"></textarea>

    <br><br>

    <input type="submit" value="SEND">

    <input type="reset" value="RESET">

</form>

</body>
</html>
