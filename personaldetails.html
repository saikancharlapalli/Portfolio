<!DOCTYPE html>
<html>
<head>
    <title>Personal Details Form</title>
</head>
<body>

<center>
<form>
<table bgcolor="lightgreen" cellpadding="8" width="550">

    <tr>
        <th colspan="2">
            <font color="brown" size="5">Personal Details</font>
        </th>
    </tr>

    <tr>
        <td align="right">Name:</td>
        <td><input type="text" name="name"></td>
    </tr>

    <tr>
        <td align="right">Password:</td>
        <td><input type="password" name="password"></td>
    </tr>

    <tr>
        <td align="right">Email id :</td>
        <td><input type="email" name="email"></td>
    </tr>

    <tr>
        <td align="right">Gender:</td>
        <td>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </td>
    </tr>

    <tr>
        <td align="right">Contact:</td>
        <td><input type="number" name="contact"></td>
    </tr>

    <tr>
        <th colspan="2">
            <font color="brown" size="5">
                Educational Qualification
            </font>
        </th>
    </tr>

    <tr>
        <td align="right">Degree:</td>
        <td>
            <select name="degree">
                <option>-- Select Group --</option>
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>B.Com</option>
                <option>BA</option>
            </select>
        </td>
    </tr>

    <tr>
        <td align="right">Engineering:</td>
        <td>
            <select name="engineering">
                <option>-- Select Group --</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>
        </td>
    </tr>

    <tr>
        <td align="right">Hobbies:</td>
        <td>
            <input type="checkbox" name="hobby" value="Chess">
            Playing chess

            <input type="checkbox" name="hobby" value="Books">
            Reading Books
        </td>
    </tr>

    <tr>
        <th colspan="2">
            <font color="brown" size="5">Address</font>
        </th>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <textarea name="address" rows="5" cols="40"></textarea>
        </td>
    </tr>

    <tr>
        <td align="right">Attach Resume:</td>
        <td><input type="file" name="resume"></td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="SUBMIT">
        </td>
    </tr>

</table>
</form>
</center>

</body>
</html>
