<!DOCTYPE html>
<html>
<head>
    <title>My Website Form</title>
</head>

<body bgcolor="lightgreen">

<h1>My Website Form</h1>

<form>

    First Name:<br>
    <input type="text" name="firstname" size="35">
    <br>

    Last Name:<br>
    <input type="text" name="lastname" size="35">
    <br>

    E-mail:<br>
    <input type="email" name="email" size="35">
    <br><br>

    <fieldset>
        <legend><b>Billing Address</b></legend>

        Street:<br>
        <input type="text" name="street" size="35">
        <br>

        City:<br>
        <input type="text" name="city" size="35">
        <br>

        State:<br>
        <input type="text" name="state" size="35">
        <br>

        Zip:<br>
        <input type="text" name="zip" size="35">
        <br>

    </fieldset>

    <br>

    Click the picture to Join Us

    <br><br>

    <a href="https://www.google.com">
        <img src="joinus.jpg" alt="Join Us" width="100">
    </a>

</form>

</body>
</html>
