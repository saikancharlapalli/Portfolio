<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration form</title>
    <style>

    </style>
</head>
<h1>Student Registration Form</h1>

<form>
<table>

<tr>
    <td>Roll no. :</td>
    <td><input type="text" class="long"></td>
</tr>

<tr>
    <td>Student name :</td>
    <td>
        <input type="text" placeholder="First Name" class="medium">
        -
        <input type="text" placeholder="Last Name" class="medium">
    </td>
</tr>

<tr>
    <td>Father's name :</td>
    <td><input type="text" class="long"></td>
</tr>

<tr>
    <td>Date of birth :</td>
    <td>
        <input type="text" placeholder="Day" class="small">
        -
        <input type="text" placeholder="Month" class="small">
        -
        <input type="text" placeholder="Year" class="medium">
        (DD-MM-YYYY)
    </td>
</tr>

<tr>
    <td>Mobile no. :</td>
    <td>
        <input type="text" value="+91" class="small" readonly>
        -
        <input type="tel" class="long">
    </td>
</tr>

<tr>
    <td>Email id :</td>
    <td><input type="email" class="long"></td>
</tr>

<tr>
    <td>Password :</td>
    <td><input type="password" class="long"></td>
</tr>

<tr>
    <td>Gender :</td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </td>
</tr>

<tr>
    <td>Department :</td>
    <td>
        <input type="checkbox"> CSE
        <input type="checkbox"> IT
        <input type="checkbox"> ECE
        <input type="checkbox"> Civil
        <input type="checkbox"> Mech
    </td>
</tr>

<tr>
    <td>Course :</td>
    <td>
        <select class="long">
            <option>Select Current Course's</option>
            <option>B.Tech</option>
            <option>M.Tech</option>
            <option>MBA</option>
            <option>MCA</option>
            <option>BCA</option>
        </select>
    </td>
</tr>

<tr>
    <td>Student photo :</td>
    <td><input type="file" accept="image/*"></td>
</tr>

<tr>
    <td>City :</td>
    <td><input type="text" class="long"></td>
</tr>

<tr>
    <td>Address :</td>
    <td><textarea></textarea></td>
</tr>

<tr>
    <td colspan="2" class="register">
        <button type="submit">Register</button>
    </td>
</tr>

</table>
</form>

</body>
</html>
