<!DOCTYPE html>
<html>
<head>
    <title>Time Table</title>
</head>
<body>

<center>
<table border="5" cellpadding="10" cellspacing="3"
       width="850" bgcolor="yellow">

    <tr bgcolor="pink">
        <th colspan="7">
            <font size="6" color="purple">Time Table</font>
        </th>
    </tr>

    <tr bgcolor="green">
        <th rowspan="6">
            <font size="5" color="white">Hours</font>
        </th>
        <th><font size="5">Mon</font></th>
        <th><font size="5">Tue</font></th>
        <th><font size="5">Wed</font></th>
        <th><font size="5">Thur</font></th>
        <th><font size="5">Fri</font></th>
        <th><font size="5">Sat</font></th>
    </tr>

    <tr>
        <td rowspan="2">DBMS</td>
        <td>WT</td>
        <td>OOAD</td>
        <td>JP</td>
        <td>OR</td>
        <td>COA</td>
    </tr>

    <tr>
        <td>OR</td>
        <td>WT</td>
        <td>COA</td>
        <td>OOAD</td>
        <td>JP</td>
    </tr>

    <tr bgcolor="violet">
        <th colspan="6">
            <font size="5" color="blue">LUNCH BREAK</font>
        </th>
    </tr>

    <tr>
        <td>DBMS</td>
        <td>WT</td>
        <td>OOAD</td>
        <td>JP</td>
        <td>OR</td>
        <td>COA</td>
    </tr>

    <tr>
        <td>DBMS</td>
        <td>OR</td>
        <td>WT</td>
        <td>COA</td>
        <td>OOAD</td>
        <td>JP</td>
    </tr>

</table>
</center>

</body>
</html>
