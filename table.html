<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table{
            width: 90px;
            border: 2px solid black;
            border-spacing: 5px;
            text-align: center;
        }

        th, td {
            border: 2px solid black;
            padding: 20px;
            font-size: 25px;
        }
    </style>
</head>
<body>
    <table border = "2px" style="background-color: beige;">
        <tr>
            <th>columu1</th>
            <th>columu2</th>
            <th>columu3</th>
        </tr>
        <tr>
            <td rowspan="2">row1 cell1</td>
            <td>row1 cell2</td>
            <td>row1 cell3</td>
        </tr>
        <tr>
            <td>row2 cell2</td>
            <td>row2 cell3</td>

        </tr>
        <tr>
            <td colspan="3">row3 cell1</td>
        </tr>
    </table>
</body>
</html>
