<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Your Account</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #fb5b4b;
    --card-top: #d2695f;
    --card-bottom: #3f4a8a;
    --white: #ffffff;
    --placeholder: #8a8a8a;
    --icon: #444;
    --blue: #2f80ed;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Montserrat", Arial, sans-serif;
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    /* Replace this gradient with your own image: url("mountain.jpg") center/cover */
    background:
      linear-gradient(180deg, rgba(20,24,50,.35) 0%, rgba(20,24,50,.1) 40%, rgba(10,14,30,.6) 100%),
      linear-gradient(100deg, #6d3d3a 0%, #c9742f 28%, #5b4a63 48%, #2b3552 70%, #1a2138 100%);
    background-attachment: fixed;
  }

  /* ---------- Navbar ---------- */
  .navbar {
    max-width: 1220px;
    width: 100%;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { font-weight: 600; font-size: 17px; letter-spacing: .3px; text-transform: uppercase; }
  .nav-links { display: flex; align-items: center; gap: 44px; list-style: none; }
  .nav-links a {
    color: var(--white);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    text-transform: uppercase;
  }
  .caret::after {
    content: "";
    display: inline-block;
    margin-left: 6px;
    border: 5px solid transparent;
    border-top-color: var(--white);
    border-bottom: 0;
    vertical-align: middle;
  }
  .btn-buy {
    background: var(--coral);
    padding: 14px 24px;
    border-radius: 30px;
    font-weight: 600;
  }

  /* ---------- Card ---------- */
  main { flex: 1; display: flex; justify-content: center; padding: 40px 16px 30px; }

  .card {
    width: 100%;
    max-width: 561px;
    padding: 36px 36px 28px;
    border-radius: 6px;
    background: linear-gradient(180deg, var(--card-top) 0%, #8a5a78 55%, var(--card-bottom) 100%);
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .card h1 { text-align: center; font-size: 27px; font-weight: 600; margin-top: 10px; }
  .card .subtitle { text-align: center; font-size: 16px; margin: 8px 0 28px; }

  label, .label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .field { margin-bottom: 18px; }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--white);
    border-radius: 3px;
    height: 46px;
  }
  .input-wrap svg.icon {
    position: absolute;
    left: 14px;
    width: 15px;
    height: 15px;
    fill: var(--icon);
  }
  .input-wrap input,
  .input-wrap select {
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 0 44px 0 38px;
    font: inherit;
    font-size: 15px;
    color: #333;
  }
  .input-wrap input::placeholder { color: var(--placeholder); }
  .input-wrap:focus-within { box-shadow: 0 0 0 2px rgba(251,91,75,.6); }

  .toggle {
    position: absolute;
    right: 14px;
    background: none;
    border: 0;
    cursor: pointer;
    display: flex;
  }
  .toggle svg { width: 16px; height: 16px; fill: #555; }

  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    color: var(--placeholder);
  }
  .select-wrap select:valid { color: #333; }
  .select-wrap::after {
    content: "";
    position: absolute;
    right: 14px;
    width: 6px;
    height: 6px;
    border-right: 2px solid #333;
    border-bottom: 2px solid #333;
    transform: rotate(45deg) translateY(-2px);
    pointer-events: none;
  }

  /* ---------- Gender radios ---------- */
  .radios { display: flex; gap: 22px; margin-bottom: 14px; }
  .radios label { display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; font-size: 15px; }
  .radios input { position: absolute; opacity: 0; }
  .radios .dot {
    width: 17px; height: 17px;
    border-radius: 50%;
    background: var(--white);
    border: 2px solid #777;
    display: inline-block;
  }
  .radios input:checked + .dot {
    border-color: var(--blue);
    background: radial-gradient(circle, var(--blue) 0 38%, var(--white) 42%);
  }
  .radios input:focus-visible + .dot { outline: 2px solid var(--white); outline-offset: 2px; }

  /* ---------- Terms + submit ---------- */
  .terms { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 14px 0 18px; }
  .terms input { width: 17px; height: 17px; accent-color: var(--coral); cursor: pointer; }
  .terms label { margin: 0; font-weight: 400; }
  .terms a, .login a { color: var(--coral); text-decoration: none; }

  .btn-register {
    width: 100%;
    height: 46px;
    border: 0;
    border-radius: 30px;
    background: var(--coral);
    color: var(--white);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter .2s;
  }
  .btn-register:hover { filter: brightness(1.08); }
  .btn-register:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }

  .login { text-align: center; font-size: 14px; margin-top: 20px; }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    padding: 18px 16px 24px;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
  }
  footer .heart { color: var(--coral); margin: 0 14px; }

  @media (max-width: 800px) {
    .nav-links li:not(:last-child) { display: none; }
    .card { padding: 28px 20px 24px; }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">Paper Kit 2 Pro</div>
    <ul class="nav-links">
      <li><a href="#">Documentation</a></li>
      <li><a href="#">Components</a></li>
      <li><a href="#" class="caret">Sections</a></li>
      <li><a href="#" class="caret">Examples</a></li>
      <li><a href="#" class="btn-buy">&#128722; Buy now</a></li>
    </ul>
  </nav>

  <main>
    <form class="card" action="#" method="post">
      <h1>Create Your Account</h1>
      <p class="subtitle">Join us and get started today</p>

      <div class="field">
        <label for="name">Full Name</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 448 512"><path d="M224 256a128 128 0 1 0 0-256 128 128 0 0 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3 0 498.7 13.3 512 29.7 512h388.6c16.4 0 29.7-13.3 29.7-29.7 0-98.5-79.8-178.3-178.3-178.3h-91.4z"/></svg>
          <input type="text" id="name" placeholder="Enter your full name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 512 512"><path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4l217.6 163.2a32 32 0 0 0 38.4 0l217.6-163.2c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48H48zM0 176v208c0 35.3 28.7 64 64 64h384c35.3 0 64-28.7 64-64V176L294.4 339.2a63.9 63.9 0 0 1-76.8 0L0 176z"/></svg>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 448 512"><path d="M144 144v48h160v-48a80 80 0 0 0-160 0zm-64 48v-48a144 144 0 0 1 288 0v48h16c35.3 0 64 28.7 64 64v192c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V256c0-35.3 28.7-64 64-64h16z"/></svg>
          <input type="password" id="password" placeholder="Create a password" required>
          <button type="button" class="toggle" data-target="password" aria-label="Show password">
            <svg viewBox="0 0 576 512"><path d="M288 32C128 32 29.3 162.1 3.3 238.8a48 48 0 0 0 0 34.4C29.3 349.9 128 480 288 480s258.7-130.1 284.7-206.8a48 48 0 0 0 0-34.4C546.7 162.1 448 32 288 32zm0 384a160 160 0 1 1 0-320 160 160 0 0 1 0 320zm0-256a96 96 0 1 0 0 192 96 96 0 0 0 0-192z"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 448 512"><path d="M144 144v48h160v-48a80 80 0 0 0-160 0zm-64 48v-48a144 144 0 0 1 288 0v48h16c35.3 0 64 28.7 64 64v192c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V256c0-35.3 28.7-64 64-64h16z"/></svg>
          <input type="password" id="confirm" placeholder="Confirm your password" required>
          <button type="button" class="toggle" data-target="confirm" aria-label="Show password">
            <svg viewBox="0 0 576 512"><path d="M288 32C128 32 29.3 162.1 3.3 238.8a48 48 0 0 0 0 34.4C29.3 349.9 128 480 288 480s258.7-130.1 284.7-206.8a48 48 0 0 0 0-34.4C546.7 162.1 448 32 288 32zm0 384a160 160 0 1 1 0-320 160 160 0 0 1 0 320zm0-256a96 96 0 1 0 0 192 96 96 0 0 0 0-192z"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <span class="label">Gender</span>
        <div class="radios">
          <label><input type="radio" name="gender" value="male" checked><span class="dot"></span>Male</label>
          <label><input type="radio" name="gender" value="female"><span class="dot"></span>Female</label>
          <label><input type="radio" name="gender" value="other"><span class="dot"></span>Other</label>
        </div>
      </div>

      <div class="field">
        <label for="dob">Date of Birth</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 448 512"><path d="M128 0c17.7 0 32 14.3 32 32v32h128V32c0-17.7 14.3-32 32-32s32 14.3 32 32v32h48c26.5 0 48 21.5 48 48v48H0v-48c0-26.5 21.5-48 48-48h48V32c0-17.7 14.3-32 32-32zM0 192h448v272c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V192zm64 80v32h48v-32H64zm112 0v32h48v-32h-48zm112 0v32h48v-32h-48z"/></svg>
          <input type="text" id="dob" placeholder="Select your date of birth"
                 onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" required>
        </div>
      </div>

      <div class="field">
        <label for="country">Country</label>
        <div class="input-wrap select-wrap">
          <svg class="icon" viewBox="0 0 512 512"><path d="M256 0a256 256 0 1 0 0 512 256 256 0 0 0 0-512zm0 464c-13 0-35-22-50-70h100c-15 48-37 70-50 70zm-57-118a335 335 0 0 1 0-180h114a335 335 0 0 1 0 180H199zm-87-90c0-30 5-58 14-84h60a395 395 0 0 0 0 168h-60c-9-26-14-54-14-84zm328 0c0 30-5 58-14 84h-60a395 395 0 0 0 0-168h60c9 26 14 54 14 84zM306 118c-15-48-37-70-50-70s-35 22-50 70h100z"/></svg>
          <select id="country" required>
            <option value="" disabled selected>Select your country</option>
            <option>India</option>
            <option>United States</option>
            <option>United Kingdom</option>
            <option>Canada</option>
            <option>Australia</option>
            <option>Germany</option>
            <option>France</option>
            <option>Japan</option>
          </select>
        </div>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
      </div>

      <button type="submit" class="btn-register">Register now</button>

      <p class="login">Already have an account? <a href="#">LOGIN</a></p>
    </form>
  </main>

  <footer>
    &copy; 2019, Made with <span class="heart">&#10084;</span> by Creative Tim
  </footer>

<script>
  // Show / hide password
  document.querySelectorAll('.toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });
</script>
</body>
</html>
