<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex table</title>
</head>
<body>
    <h2 style="text-align: center;">Complex table</h2>

    <table border = "4px" align="center" cellpadding ="15" cellspacing="0">
        <tr>
            <th>Year</th>
            <th>Group</th>
            <th>Language</th>
            <th>done</th>
            <th>Passed</th>
        </tr>
        <tr>
            <td rowspan="6" align="center" >2022</td>
            <td rowspan="2" align="center">Elzero</td>
            <td>html</td>
            <td colspan="2" align="">yes</td>

        </tr>
        <tr>
            <td>css</td>
            <td colspan="2" align="">yes</td>
        </tr>
        <tr>
            <td rowspan="3" align="center" >heroes</td>
            <td>js</td>
            <td>yes</td>
            <td>no</td>

        </tr>
        <tr>
            <td>php</td>
            <td colspan="2">yes</td>

        </tr>
        <tr>
            <td>python</td>
            <td>no</td>
            <td>no</td>
        </tr>

    </table>
</body>
</html>
