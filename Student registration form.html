<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ff4e1a, #e8531f);
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 30px 15px;
      padding: 20px 25px 25px;
      background: #f1f5fb;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      margin: 0 0 15px;
      font-size: 28px;
      color: #2c3e50;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
      flex: 1;
    }

    .row {
      display: flex;
      gap: 20px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="date"],
    input[type="file"],
    select,
    textarea {
      width: 100%;
      padding: 9px;
      font-size: 14px;
      border: 2px solid #3b5998;
      border-radius: 3px;
      background: #f1f5fb;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    .options {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .options label {
      font-weight: normal;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      color: #fff;
      background: #e8531f;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #c9430f;
    }

    @media (max-width: 600px) {
      .row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Student Registration Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">

      <div class="form-group">
        <label for="name">Student Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="mobile">Mobile No.</label>
          <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required>
        </div>
        <div class="form-group">
          <label for="email">Email Id</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="father">Father Name</label>
          <input type="text" id="father" name="father">
        </div>
        <div class="form-group">
          <label for="mother">Mother Name</label>
          <input type="text" id="mother" name="mother">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="course">Select Course</label>
          <select id="course" name="course" required>
            <option value="">Select...</option>
            <option value="btech">B.Tech</option>
            <option value="bca">BCA</option>
            <option value="mca">MCA</option>
            <option value="mba">MBA</option>
          </select>
        </div>
        <div class="form-group">
          <label for="dob">Date Of Birth</label>
          <input type="date" id="dob" name="dob" required>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Gender</label>
          <div class="options">
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
          </div>
        </div>
        <div class="form-group">
          <label for="photo">Student Photo</label>
          <input type="file" id="photo" name="photo" accept="image/*">
        </div>
      </div>

      <div class="form-group">
        <label>Select Branch</label>
        <div class="options">
          <label><input type="checkbox" name="branch" value="CSE"> CSE</label>
          <label><input type="checkbox" name="branch" value="IT"> IT</label>
          <label><input type="checkbox" name="branch" value="ECE"> ECE</label>
          <label><input type="checkbox" name="branch" value="Civil"> Civil</label>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address"></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>

</body>
</html>
