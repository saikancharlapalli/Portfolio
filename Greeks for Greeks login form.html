<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeeksforGeeks Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #dfe6f5, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-container {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .login-container h1 {
      color: #2f8d46;
      margin: 0 0 20px;
    }

    .login-container h3 {
      color: #333;
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      color: #1a2a5a;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #c5d0e6;
      border-radius: 6px;
      font-size: 15px;
      background: #f4f7fc;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2f8d46;
      box-shadow: 0 0 5px rgba(47, 141, 70, 0.4);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #2f8d46;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #267a3a;
    }

    .register-text {
      margin-top: 25px;
      color: #333;
      font-size: 16px;
    }

    .register-text a {
      color: #1a3cc8;
      text-decoration: none;
    }

    .register-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>GeeksforGeeks</h1>
    <h3>Enter your login credentials</h3>

    <form action="#" method="post">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your Username" required>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your Password" required>
      </div>

      <button type="submit" class="submit-btn">Submit</button>
    </form>

    <p class="register-text">Not registered? <a href="#">Create an account</a></p>
  </div>

</body>
</html>
